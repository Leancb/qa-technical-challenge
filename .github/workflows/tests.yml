name: Web and API tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    name: Tests - ${{ matrix.suite }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        suite: [api, web]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Run suite
        run: mvn -B -ntp clean test '-Dgroups=${{ matrix.suite }}'
      - name: Generate HTML report
        if: always()
        run: mvn -B -ntp surefire-report:report-only
      - name: Preserve test reports and failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.suite }}
          path: |
            target/surefire-reports/
            target/reports/
            target/site/
            target/evidence/
          retention-days: 14
